name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  notify-indexers:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: eic-docs-mcp
        if: ${{ vars.EIC_DOCS_MCP_URL != '' }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" "$URL/refresh"
        env:
          URL: ${{ vars.EIC_DOCS_MCP_URL }}
          TOKEN: ${{ secrets.EIC_DOCS_REFRESH_TOKEN }}
      - name: EIC smart search
        if: ${{ vars.EIC_SEARCH_URL != '' }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -A knowledge-guide -d '{"source_names":["eic_knowledge_guide"],"full_reindex":true}' "$URL/ingest/run"
        env:
          URL: ${{ vars.EIC_SEARCH_URL }}
          TOKEN: ${{ secrets.EIC_SEARCH_ADMIN_TOKEN }}
