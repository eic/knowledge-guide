remote_theme: just-the-docs/just-the-docs@v0.10.1

title: EIC Knowledge Guide
description: How ePIC reconstruction and simulation work — generated from source, verified against it
url: "https://eic.github.io"
baseurl: "/knowledge-guide"
repository: eic/knowledge-guide

color_scheme: light
aux_links_new_tab: true
search_enabled: true

aux_links:
  EICrecon source: https://github.com/eic/EICrecon
  ePIC geometry: https://github.com/eic/epic

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue

exclude:
  - README.md
  - CODEOWNERS
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
